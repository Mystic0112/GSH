[package]
name = "gsh-app"
description = "GSH UI (iced): janela, layout de workspaces, panes e arquivos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "gsh-app"
path = "src/main.rs"

[dependencies]
gsh-chat = { path = "../chat" }
gsh-db = { path = "../db" }
gsh-config = { path = "../config" }
gsh-core = { path = "../core" }
gsh-editor = { path = "../editor" }
gsh-git = { path = "../git" }
gsh-harness = { path = "../harness" }
gsh-search = { path = "../search" }
gsh-ipc = { path = "../ipc" }
gsh-telemetry = { path = "../telemetry" }
gsh-term = { path = "../term" }
gsh-team = { path = "../team" }
iced = { version = "0.14", features = ["advanced", "canvas", "tokio", "svg", "image", "markdown"] }
arboard = { version = "3.7", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pulldown-cmark = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rfd.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml_edit = "0.25"
zeroize = { version = "1.9", features = ["derive"] }

# Só para o fuso local do hh:mm da atividade dos agentes (`localtime_r`); já está no Cargo.lock
# (alacritty_terminal, dirs-sys), então não traz crate novo ao build.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
iced_test = "0.14"
ttf-parser = "0.25.1"
# só os testes do banco criam arquivos SQLite temporários
rusqlite = { version = "0.43.0", features = ["bundled"] }
tempfile = "3.27.0"
