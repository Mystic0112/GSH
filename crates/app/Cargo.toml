[package]
name = "gsh-app"
description = "GSH UI (iced): janela, layout de workspaces, panes e arquivos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "gsh-app"
path = "src/main.rs"

[dependencies]
gsh-chat = { path = "../chat" }
gsh-core = { path = "../core" }
gsh-ipc = { path = "../ipc" }
gsh-term = { path = "../term" }
iced = { version = "0.14", features = ["canvas", "tokio"] }
rfd.workspace = true
serde_json.workspace = true
thiserror.workspace = true
