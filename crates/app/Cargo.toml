[package]
name = "gsh-app"
description = "GSH UI (iced): janela, layout de workspaces, panes e arquivos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "gsh-app"
path = "src/main.rs"

[dependencies]
gsh-chat = { path = "../chat" }
gsh-db = { path = "../db" }
gsh-config = { path = "../config" }
gsh-core = { path = "../core" }
gsh-editor = { path = "../editor" }
gsh-git = { path = "../git" }
gsh-harness = { path = "../harness" }
gsh-search = { path = "../search" }
gsh-ipc = { path = "../ipc" }
gsh-term = { path = "../term" }
iced = { version = "0.14", features = ["advanced", "canvas", "tokio", "svg", "image"] }
rfd.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml_edit = "0.25"
