[package]
name = "gsh-config"
description = "GSH user configuration file: typed TOML schema, load and reload by polling (std only, no UI)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Leitura e gravação (migração) tipada do schema. `derive` gera os impls.
serde = { version = "1", features = ["derive"] }
# Leitura do `settings.json` do Flutter na migração inicial.
serde_json.workspace = true
# Parser e serializer TOML com posição (span) nos erros, para devolver linha e
# coluna. Os crates de baixo (`toml_parser`, `toml_datetime`, `toml_writer`) já
# estão no Cargo.lock.
toml = { version = "1", default-features = false, features = ["std", "parse", "display", "serde"] }
# Home e pastas padrão do usuário multiplataforma (no Windows via Known Folder,
# não `HOME`).
dirs = "6"
# Enum de erro tipado.
thiserror.workspace = true
