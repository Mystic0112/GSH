[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/ipc", "crates/app", "crates/config", "crates/term", "crates/chat", "crates/git", "crates/editor", "crates/db"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Mystic0112/GSH"

[workspace.dependencies]
rfd = "0.15"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
